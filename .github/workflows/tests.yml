name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglx0 \
            libxrender1 \
            libxext6 \
            libx11-6 \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libfontconfig1 \
            libdbus-1-3 \
            xvfb

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        run: xvfb-run --auto-servernum uv run pytest tests/
